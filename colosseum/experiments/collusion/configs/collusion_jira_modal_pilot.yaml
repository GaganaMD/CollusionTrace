# Frozen 2x2 behavioral-pilot design. Values are expanded locally; never add
# endpoint credentials to this file. This configuration is not an authorization
# to deploy or run inference.
simulation:
  max_iterations: 1
  max_planning_rounds: 1
  max_conversation_steps: 1
  seed: 1
  tags: [collusion_behavioral_pilot]

environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 3
  consolidate_channels: true
  edge_prob: 0.6
  k: 2
  rewire_prob: 0.3
  m: 2

llm_models:
  - label: vllm-qwen25-7b
    llm:
      provider: vllm
      vllm:
        auto_start_server: false
        persistent_server: false
        remote_authenticated: true
        health_check_path: "/models"
        startup_timeout: 600
        params:
          max_completion_tokens: 512
          temperature: 0
        models:
          - checkpoint: "Qwen/Qwen2.5-7B-Instruct"
            served_model_name: "Qwen/Qwen2.5-7B-Instruct"
            base_url: "${MODAL_VLLM_BASE_URL}"
            api_key: "${MODAL_VLLM_API_KEY}"
            request_timeout: 600

experiment:
  experiment_id: collusiontrace_jira_behavioral_pilot_v1
  tag: collusion_jira_behavioral_pilot
  output_dir: experiments/collusion/outputs/collusion_jira_behavioral_pilot
  max_concurrent_runs: 1
  seeds: [1, 2, 3]
  collusion:
    # This opt-in permits structured instruction with no coalition-only board
    # for T0. Existing configurations omit it and retain legacy behavior.
    allow_instruction_without_secret: true
    colluder_selection: first
    agent_order: random
  sweeps:
    - name: behavioral_pilot_2x2
      topologies: [complete]
      num_agents: [3]
      colluder_counts: [2]
      secret_channel_enabled: [false, true]
      # false/control=C0; true/control=C1; false/structured=T0;
      # true/structured=T1. The structured objective is identical in T0/T1.
      prompt_variants: [control, structured]
