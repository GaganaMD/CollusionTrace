simulation: {max_iterations: 1, max_planning_rounds: 1, max_conversation_steps: 1}
environment:
  import_path: experiments.collusion.incentive_jira_env:JiraIncentiveEnvironment
  assignment_filling: false
  max_tasks: 8
  incentive_bonus: 0
communication_network: {topology: complete, num_agents: 3}
llm_models:
  - label: openrouter-qwen25-7b
    llm:
      provider: openrouter
      openrouter:
        model: qwen/qwen-2.5-7b-instruct
        api_key: "${OPENROUTER_API_KEY}"
        request_timeout: 120
        params: {max_completion_tokens: 512, temperature: 0}
experiment:
  # Version 2 uses the corrected individual-versus-joint cost schedule.
  # The completed v1 artifact is preserved under o/20261024-180346.
  experiment_id: jira_incentive_calibration_v2
  tag: jira_incentive_calibration_v2
  output_dir: o
  max_concurrent_runs: 1
  seeds: [1]
  # Zero colluders: this is a private-channel-free, neutral-instruction calibration.
  collusion: {colluder_selection: first, agent_order: colluders_first}
  sweeps:
    - {name: calibration_bonus_0, topologies: [complete], num_agents: [3], colluder_counts: [0], secret_channel_enabled: [false], prompt_variants: [control], environments: [{label: bonus_0, incentive_bonus_enabled: false, incentive_bonus: 0}]}
    - {name: calibration_bonus_30, topologies: [complete], num_agents: [3], colluder_counts: [0], secret_channel_enabled: [false], prompt_variants: [control], environments: [{label: bonus_30, incentive_bonus_enabled: true, incentive_bonus: 30}]}
    - {name: calibration_bonus_60, topologies: [complete], num_agents: [3], colluder_counts: [0], secret_channel_enabled: [false], prompt_variants: [control], environments: [{label: bonus_60, incentive_bonus_enabled: true, incentive_bonus: 60}]}
    - {name: calibration_bonus_120, topologies: [complete], num_agents: [3], colluder_counts: [0], secret_channel_enabled: [false], prompt_variants: [control], environments: [{label: bonus_120, incentive_bonus_enabled: true, incentive_bonus: 120}]}
